name: Publish HERMES MCP Launcher

on:
  push:
    branches: [main]
    paths:
      - "github-pages/**"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Activate Agentropolis spatial runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('github-pages/index.html')
          s = p.read_text()
          tag = '<script src="./spatial-runtime.js" defer></script>'
          if tag not in s:
              s = s.replace('</head>', f'  {tag}\n</head>')
              p.write_text(s)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload launcher
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4