name: Cloudflare Production Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/verify-jspace-production.mjs"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      JSPACE_BASE_URL: https://agentropolis-agent-mcp.chaoswired.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require sealed deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured in the production environment."; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured in the production environment."; exit 2; }
      - name: Validate production candidate
        run: npm run check
      - name: Apply D1 migrations
        run: npx --yes wrangler@4.114.0 d1 migrations apply DB --remote
      - name: Deploy Worker
        run: npx --yes wrangler@4.114.0 deploy --var "BUILD_SHA:${GITHUB_SHA}" --var "BUILD_ID:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Verify public health
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const base=process.env.JSPACE_BASE_URL;
          const checks=['/health','/api/jspace?view=manifest','/api/jspace?view=projection'];
          for (const path of checks) {
            const r=await fetch(base+path,{headers:{accept:'application/json'}});
            if (!r.ok) throw new Error(`${path} returned ${r.status}`);
            console.log(`${path} OK ${r.status}`);
          }
          NODE
      - name: Verify JSpace production semantics
        run: npm run jspace:verify-production
